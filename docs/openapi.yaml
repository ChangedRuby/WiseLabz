openapi: 3.0.3
info:
  title: WiseLabz REST API
  version: 0.1.0
  description: >
    Contract-first OpenAPI spec for the WiseLabz frontend. This is the source of
    truth the frontend generates against (orval) and mocks against (MSW) BEFORE the
    Go backend exists. The backend implements *to* this spec. Keep this file and
    docs/WS_CONTRACT.md in sync with docs/FRONTEND_PLAN.md (§1 endpoints, §4 WS).
servers:
  - url: /api
    description: Same-origin API (Vite proxies /api to the Go backend in dev)
  - url: /api/v1
    description: >
      Versioned alias of the same API. Every path is served identically under
      /api and /api/v1; /api is kept for existing clients.

tags:
  - name: auth
  - name: me
  - name: users
  - name: dashboard
  - name: connectors
  - name: compliance
  - name: docs
  - name: chat
  - name: templates
  - name: changes
  - name: attention
  - name: alerts
  - name: runbooks
  - name: findings
  - name: notifications
  - name: saved-views
  - name: settings
  - name: system

security:
  - bearerAuth: []

paths:
  # ───────────────────────── auth ─────────────────────────
  /auth/providers:
    get:
      tags: [auth]
      summary: List enabled auth providers (local + OIDC) for the login screen
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviders' }
  /auth/login:
    post:
      tags: [auth]
      summary: Local username/password login
      description: >
        On success returns a short-lived access token in the body and sets the
        refresh token as an HttpOnly; Secure; SameSite=Strict cookie (§8.7).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/oidc/callback:
    post:
      tags: [auth]
      summary: Exchange an OIDC authorization code for a WiseLabz session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OidcCallbackRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Silent refresh — mints a new access token from the refresh cookie
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the refresh token and clear the cookie
      responses:
        '204': { description: No Content }
  /auth/elevate:
    post:
      tags: [auth]
      summary: Step-up re-authentication for a single destructive action
      description: >
        Re-authenticates the current operator (password, or TOTP when configured)
        and mints a short-lived elevation token scoped to one destructive action
        (ARCHITECTURE.md 2026-06-27). The token is replayed in the `X-Elevation-Token`
        header on the destructive request (e.g. connector removal). Only required
        when `stepUpForDestructive` is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElevationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElevationToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/api-keys:
    get:
      tags: [auth]
      summary: List the current user's API keys
      responses:
        '200':
          description: API keys without token material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [auth]
      summary: Create an API key for the current user
      description: The opaque token is returned once and cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: Created; token is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/api-keys/{id}:
    delete:
      tags: [auth]
      summary: Revoke one of the current user's API keys
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── me ─────────────────────────
  /me:
    get:
      tags: [me]
      summary: Current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      summary: Update own profile (display name, email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/password:
    post:
      tags: [me]
      summary: Change own password (local accounts only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/sessions:
    get:
      tags: [me]
      summary: List own active sessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
  /me/sessions/{sessionId}:
    delete:
      tags: [me]
      summary: Revoke one of own sessions
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: No Content }

  # ───────────────────────── users (admin) ─────────────────────────
  /users:
    get:
      tags: [users]
      summary: List users (operator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: Create / invite a user (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    patch:
      tags: [users]
      summary: Update a user's role or status (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [users]
      summary: Delete a user (operator)
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /users/{userId}/reset-password:
    post:
      tags: [users]
      summary: Operator-triggered password reset
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }

  # ───────────────────────── dashboard ─────────────────────────
  /dashboard/overview:
    get:
      tags: [dashboard]
      summary: Aggregate overview (status counts, recent changes, alert summary)
      parameters: [{ $ref: '#/components/parameters/DaysQuery' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardOverview' }
  /dashboard/layout:
    get:
      tags: [dashboard]
      summary: Current user's saved widget layout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
    put:
      tags: [dashboard]
      summary: Persist current user's widget layout (per-user, §8.5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardLayout' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
  /dashboard/layout/admin-default:
    get:
      tags: [dashboard]
      summary: Admin-default dashboard layout (operator)
      description: >
        Retrieve the system-wide default dashboard layout configured by operators.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [dashboard]
      summary: Update admin-default dashboard layout (operator)
      description: >
        Update the system-wide default layout that new users or reset users inherit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardLayout' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard/layout/reset:
    post:
      tags: [dashboard]
      summary: Reset to admin-default dashboard layout
      description: >
        Overwrite the current user's layout with the system-wide admin default.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }

  # ───────────────────────── connectors ─────────────────────────
  /connectors:
    get:
      tags: [connectors]
      summary: List connectors with live status, grouped client-side by category
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connector' }
    post:
      tags: [connectors]
      summary: Create a connector (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connectors/schema:
    get:
      tags: [connectors]
      summary: Category/type field metadata used to render schema-driven forms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorTypeSchema' }
  /compliance/schema:
    get:
      tags: [compliance]
      summary: Connector entity attribute catalog for compliance rules (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: array
                    items: { $ref: '#/components/schemas/ComplianceAttributeSpec' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /compliance/rules:
    get:
      tags: [compliance]
      summary: List compliance rules (admin only)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRulePage' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [compliance]
      summary: Create a compliance rule (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /compliance/rules/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [compliance]
      summary: Get a compliance rule (admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [compliance]
      summary: Replace a compliance rule (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [compliance]
      summary: Delete a compliance rule (admin only)
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
  /compliance/rules/test:
    post:
      tags: [compliance]
      summary: Test an unsaved compliance rule without writing findings (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleTestResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/{connectorId}:
    parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
    get:
      tags: [connectors]
      summary: One connector
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [connectors]
      summary: Update a connector (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Remove a connector (operator, destructive)
      description: >
        Destructive: cascades to the connector's snapshots and generated doc
        sections (see GET /removal-impact for the blast radius). When
        `stepUpForDestructive` is enabled, requires a valid `X-Elevation-Token`
        from POST /auth/elevate; absent or expired tokens get a 403
        `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /connectors/{connectorId}/removal-impact:
    get:
      tags: [connectors]
      summary: Blast radius for removing this connector (operator)
      description: >
        Computes the concrete dependents a removal destroys, so the UI can state
        them exactly before the user commits (machine-honest confirm pattern).
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalImpact' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/restart:
    post:
      tags: [connectors]
      summary: Preview or perform a service restart (operator, elevation-gated)
      description: >
        With `dryRun=true`, returns a restart preview from the latest stored
        service snapshot without touching the connector — no elevation token
        required. With `dryRun` absent or `false`, performs the real restart:
        requires a valid `X-Elevation-Token` for action `connector.restart`
        (from `POST /auth/elevate`), and 400s with `unsupported_operation` if
        the connector type has no restart capability. On success, records a
        `connector.restart` audit row; on failure, raises an `AlertRecord`
        instead of retrying (see ADR 0001).
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the restart without performing it; absent/false
            performs the real, elevation-gated restart.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.restart. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId (e.g. a VM ID,
                    container ID, or service name), or omitted for connectors
                    that manage a single implicit service. Ignored for
                    dry-run previews.
      responses:
        '200':
          description: Restart preview, or restart performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support restart (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Restart failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/start:
    post:
      tags: [connectors]
      summary: Preview or perform a service start (operator, elevation-gated)
      description: >
        Same dry-run/elevation-gated-mutate shape as /restart (see ADR 0002):
        dryRun=true previews from the latest stored snapshot; absent/false
        performs the real start, requiring a valid X-Elevation-Token for
        action connector.start. 400s with unsupported_operation if the
        connector type has no start capability. On success, records a
        connector.start audit row; on failure, raises an AlertRecord.
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the start without performing it; absent/false
            performs the real, elevation-gated start.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.start. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId, or omitted for
                    connectors that manage a single implicit service.
                    Ignored for dry-run previews.
      responses:
        '200':
          description: Start preview, or start performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support start (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Start failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/stop:
    post:
      tags: [connectors]
      summary: Preview or perform a service stop (operator, elevation-gated)
      description: >
        Same dry-run/elevation-gated-mutate shape as /restart (see ADR 0002):
        dryRun=true previews from the latest stored snapshot; absent/false
        performs the real stop, requiring a valid X-Elevation-Token for
        action connector.stop. estimatedDowntimeSeconds is 0 in the preview
        since a stop's downtime is indefinite until an explicit start. 400s
        with unsupported_operation if the connector type has no stop
        capability. On success, records a connector.stop audit row; on
        failure, raises an AlertRecord.
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the stop without performing it; absent/false
            performs the real, elevation-gated stop.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.stop. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId, or omitted for
                    connectors that manage a single implicit service.
                    Ignored for dry-run previews.
      responses:
        '200':
          description: Stop preview, or stop performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support stop (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Stop failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/config-fields:
    get:
      tags: [connectors]
      summary: List a connector's whitelisted config-push fields
      description: >
        Returns the connector's WritableFields() (ADR 0003), or an empty
        array if the connector type doesn't implement config-push.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigField' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/config-push:
    post:
      tags: [connectors]
      summary: Push one whitelisted config field (operator, elevation-gated)
      description: >
        Field-level partial update per ADR 0003: requires a valid
        X-Elevation-Token for action connector.configPush. Snapshots the
        connector before the write, applies it, re-fetches, and diffs. On a
        verified match, records a connector.configPush audit row and returns
        the post-push snapshot. On mismatch, auto-reverts to previousValue
        and raises a critical AlertRecord (escalated further if the revert
        itself fails), returning 409. 400s with unsupported_operation if the
        connector doesn't implement config-push, or unsupported_field if
        fieldKey isn't in WritableFields().
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: X-Elevation-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.configPush.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldKey, value]
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity ref, required when the field's
                    ConfigField.entityScope is true.
                fieldKey: { type: string }
                value: {}
                previousValue:
                  description: >
                    The field's currently-displayed value (read from GET
                    /{connectorId}/data before editing), used to revert if
                    the push doesn't verify.
      responses:
        '200':
          description: Config push verified; post-push snapshot returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSnapshot' }
        '400':
          description: >
            Bad request, missing elevation token, unsupported_operation, or
            unsupported_field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            config_push_mismatch — the push didn't verify; auto-revert was
            attempted (see the new critical AlertRecord for whether it
            succeeded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Config push failed upstream (write itself errored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/data:
    get:
      tags: [connectors]
      summary: Latest fetched service snapshot (live data)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/uptime:
    get:
      tags: [connectors]
      summary: Availability % and MTTR over 24h/7d/30d windows
      description: >
        Computed from the health_checks time series recorded by POST
        /connectors/{connectorId}/health. Availability is time-weighted
        between consecutive checks, and MTTR (mean time to recovery) is the
        mean time from an "offline" check to the next check that isn't,
        counting only outages that both started and recovered inside each
        window.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UptimeReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/test:
    post:
      tags: [connectors]
      summary: Test connection without saving
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
  /connectors/{connectorId}/health:
    post:
      tags: [connectors]
      summary: Cheap connectivity check (no fetch, no snapshot, no docs); persists status
      description: >
        Runs the connector's Validate step only and saves the resulting
        online/degraded/offline status, independently of running a full sync.
        Unlike /test, this call updates the connector's persisted status.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthCheckResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/sync:
    post:
      tags: [connectors]
      summary: Trigger a sync for one connector (progress streams over /ws)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                  description: >-
                    Optional selective-fetch hint (e.g. ["vms","storage"]) for a
                    partial sync. A connector type that doesn't support selective
                    fetch ignores it and fetches everything.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJobRef' }
  /connectors/{connectorId}/syncs:
    get:
      tags: [connectors]
      summary: Recent sync run history for one connector (newest first)
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          headers:
            X-Next-Cursor:
              description: >-
                Cursor for the next keyset page, present only when `cursor` was
                sent and more rows follow. This response body is a bare array,
                so the cursor rides on a header rather than an envelope field.
              required: false
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncRun' }
  /connectors/bulk-sync:
    post:
      tags: [connectors]
      summary: Trigger a sync for an explicit list of connectors in one request
      description: >
        Fans out an async sync per connector (same as POST
        /connectors/{connectorId}/sync); progress for each streams over /ws.
        The caller must supply an explicit list of connector IDs. One bad ID
        never aborts the batch — the response reports a per-item outcome, and
        one audit record is written per successfully-started item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkSyncRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkSyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/bulk-reauth:
    post:
      tags: [connectors]
      summary: Refresh credentials for an explicit list of connectors in one request
      description: >
        For each connector implementing credential refresh, refreshes and
        persists its credentials. Not elevation-gated (matches how
        single-connector sync/re-auth aren't gated today either). One bad ID
        never aborts the batch; one audit record is written per
        successfully-refreshed item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkReauthRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkReauthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/bulk-restart:
    post:
      tags: [connectors]
      summary: Restart an explicit list of connectors in one request
      description: >
        Gated by X-Elevation-Token, action `connector.bulkRestart` — one
        elevation covers the whole batch, not one per item. One bad ID never
        aborts the batch; one audit record is written per
        successfully-restarted item.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkRestartRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkRestartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connectors/{connectorId}/enabled:
    put:
      tags: [connectors]
      summary: Enable/disable a connector
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }

  /connectors/{connectorId}/maintenance-window:
    get:
      tags: [connectors]
      summary: Get a connector's active maintenance window, if any
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/MaintenanceWindow' }]
                nullable: true
    post:
      tags: [connectors]
      summary: Open a time-boxed maintenance window on a connector
      description: >
        While active, the scheduler skips this connector and drift
        alerting/change-record creation from any sync (scheduled or manual)
        is suppressed, though snapshots keep being saved. Operator-only, no
        step-up elevation required — reversible and time-boxed.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenMaintenanceWindowRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Close a connector's active maintenance window early (no-op if none)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean }

  /connectors/{connectorId}/golden-snapshot:
    get:
      tags: [connectors]
      summary: Get a connector's pinned golden snapshot, if any
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/GoldenSnapshot' }]
                nullable: true
    post:
      tags: [connectors]
      summary: Pin a snapshot as the connector's golden configuration baseline
      description: >
        Later syncs are compared against this snapshot (not just the
        immediately previous one) and a config_drift quality finding is
        raised when attributes deviate. Operator-only.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinGoldenSnapshotRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoldenSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Unpin a connector's golden snapshot (no-op if none)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unpinned]
                properties:
                  unpinned: { type: boolean }

  /connectors/maintenance-windows:
    get:
      tags: [connectors]
      summary: List every currently active maintenance window, across all connectors
      description: Used by the services list badge to avoid an N+1 fetch per row.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceWindow' }

  /sync:
    post:
      tags: [connectors]
      summary: Trigger a global sync of all connectors
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJobRef' }

  # ───────────────────────── docs ─────────────────────────
  /docs:
    get:
      tags: [docs]
      summary: Flat searchable list of all docs (any authenticated user)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
  /docs/tree:
    get:
      tags: [docs]
      summary: Hierarchical doc tree (lab root + per-service children)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNode' }
  /docs/service/{connectorId}:
    get:
      tags: [docs]
      summary: The doc node for a given service
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/{docId}:
    parameters: [{ $ref: '#/components/parameters/DocId' }]
    get:
      tags: [docs]
      summary: Rendered doc node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [docs]
      summary: Save doc content (creates a new version; editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocSave' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Version conflict — baseVersion is stale. Body is the current server-side
            Doc (content + currentVersion) so the client can reconcile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
  /docs/{docId}/versions:
    get:
      tags: [docs]
      summary: Version history list for a doc node
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocVersionMeta' }
  /docs/{docId}/versions/{rev}:
    get:
      tags: [docs]
      summary: A specific doc revision
      parameters:
        - { $ref: '#/components/parameters/DocId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocVersion' }
  /docs/{docId}/versions/{rev}/restore:
    post:
      tags: [docs]
      summary: Restore a past revision as a new current version (editor+)
      parameters:
        - { $ref: '#/components/parameters/DocId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
  /docs/{docId}/ai-suggest:
    post:
      tags: [docs]
      summary: Request an AI suggestion for the doc (result streams via doc.ai_suggestion WS)
      description: Only available when the AI module is enabled (§2). Returns a request id to correlate with WS events.
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestRef' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /docs/{docId}/lock:
    parameters: [{ $ref: '#/components/parameters/DocId' }]
    get:
      tags: [docs]
      summary: Current advisory edit lock on the doc, if any (any authenticated user)
      responses:
        '200':
          description: OK — empty object if unlocked/expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
    post:
      tags: [docs]
      summary: Acquire or renew the advisory edit lock (editor+). Advisory only — never blocks Save.
      responses:
        '200':
          description: Lock acquired or renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
        '409':
          description: Lock held by another user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
  /docs/{docId}/lock/release:
    post:
      tags: [docs]
      summary: Release the advisory edit lock if held by the caller (editor+)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
  /docs/template-schema:
    get:
      tags: [docs]
      summary: Available templateData field paths and filter functions, for editor reference
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateSchema' }
  /docs/generate:
    post:
      tags: [docs]
      summary: Generate a doc from a template applied to a connector's live snapshot
      operationId: postDocsGenerate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, connectorId]
              properties:
                templateId: { type: string }
                connectorId: { type: string }
      responses:
        '201':
          description: Doc generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Template or connector not found }

  /docs/topology:
    post:
      tags: [docs]
      summary: (Re)generate the single lab-wide topology doc from every connector's latest snapshot
      operationId: postDocsTopology
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Topology doc generated or refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResult' }

  # ───────────────────────── chat ─────────────────────────
  /chat/conversations:
    get:
      tags: [chat]
      summary: List the caller's "ask your lab" chat conversations, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatConversation' }
    post:
      tags: [chat]
      summary: Start a new chat conversation scoped to a doc or the whole lab
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatConversationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /chat/conversations/{id}:
    get:
      tags: [chat]
      summary: A conversation plus its full message history
      parameters:
        - { $ref: '#/components/parameters/ChatConversationId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversationDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages:
    post:
      tags: [chat]
      summary: Ask a question in the conversation; retrieves matching doc sections and answers via the configured AI provider
      parameters:
        - { $ref: '#/components/parameters/ChatConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageCreate' }
      responses:
        '200':
          description: OK — the assistant's reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── templates ─────────────────────────
  /templates:
    get:
      tags: [templates]
      summary: List templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
    post:
      tags: [templates]
      summary: Create a template (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /templates/{templateId}:
    parameters: [{ $ref: '#/components/parameters/TemplateId' }]
    get:
      tags: [templates]
      summary: One template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [templates]
      summary: Update a template (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
    delete:
      tags: [templates]
      summary: Delete a template (editor+)
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /templates/{templateId}/preview:
    post:
      tags: [templates]
      summary: Preview this template's impact without persisting changes
      description: >
        Lists matching connectors and, when connectorId is supplied, renders a
        detailed preview. This operation does not create or update documents or versions.
      parameters: [{ $ref: '#/components/parameters/TemplateId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                connectorId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePreviewResult' }
  /templates/{templateId}/versions:
    get:
      tags: [templates]
      summary: Version history list for a template
      parameters: [{ $ref: '#/components/parameters/TemplateId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateVersionMeta' }
  /templates/{templateId}/versions/{rev}:
    get:
      tags: [templates]
      summary: A specific template revision
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersion' }
  /templates/{templateId}/versions/{rev}/restore:
    post:
      tags: [templates]
      summary: Restore a past template revision as a new current version (editor+)
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }

  # ───────────────────────── changes ─────────────────────────
  /changes:
    get:
      tags: [changes]
      summary: Global changelog feed
      parameters:
        - { $ref: '#/components/parameters/ServiceIdQuery' }
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
  /changes/{changeId}:
    parameters: [{ $ref: '#/components/parameters/ChangeId' }]
    get:
      tags: [changes]
      summary: One change with before/after diff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /changes/{changeId}/ack:
    post:
      tags: [changes]
      summary: Acknowledge a change
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
  /changes/{changeId}/dismiss:
    post:
      tags: [changes]
      summary: Dismiss a change
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
  /changes/bulk-resolve:
    post:
      tags: [changes]
      summary: Acknowledge or dismiss an explicit list of changes in one request
      description: >
        Bulk review action for low-risk changes (issue #27). The caller must
        supply an explicit list of change IDs — there is no "all matching
        the current filter" option, by design. "Low-risk" is enforced
        server-side as severity != critical; the client's selection is never
        trusted. Each ID is independently verified (exists, not critical)
        and resolved on its own — one bad ID never aborts the batch. The
        response reports a per-item outcome, and one audit record is written
        per successfully-resolved item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkResolveRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResolveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /changes/{changeId}/ai-update:
    post:
      tags: [changes]
      summary: Trigger an AI doc update for this change (AI module must be enabled)
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestRef' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /changes/{changeId}/explain:
    post:
      tags: [changes]
      summary: Generate (or return the cached) plain-English narration for a change
      description: >
        On-demand narration of why this change matters, separate from the
        AI doc-update suggestion. The first call generates and persists the
        narration on the change record; subsequent calls return the cached
        text without re-invoking the AI provider.
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: AI provider failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── alerts ─────────────────────────
  /alerts:
    get:
      tags: [alerts]
      summary: Alert center list
      parameters:
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/DaysQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
  /alerts/{alertId}:
    parameters: [{ $ref: '#/components/parameters/AlertId' }]
    get:
      tags: [alerts]
      summary: One alert
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts/{alertId}/resolve:
    post:
      tags: [alerts]
      summary: Resolve an alert
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/{alertId}/dismiss:
    post:
      tags: [alerts]
      summary: Dismiss an alert
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/{alertId}/snooze:
