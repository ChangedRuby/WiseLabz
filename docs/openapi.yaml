              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/bulk-snooze:
    post:
      tags: [alerts]
      summary: Snooze multiple alerts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertBulkSnoozeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertBulkSnoozeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────── attention queue ─────────────────────────
  /attention:
    get:
      tags: [attention]
      summary: Recovery book attention queue — merged alerts and findings
      description: >
        Aggregates open alerts and findings, sorted by severity then age.
        Each item can be resolved via the alert or finding resolution endpoints.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/DaysQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttentionPage' }

  # ───────────────────────── runbooks ─────────────────────────
  /runbooks:
    get:
      tags: [runbooks]
      summary: List runbooks, optionally filtered by change type or alert severity
      description: >
        `changeType` and `alertSeverity` are mutually exclusive filters — pass
        at most one. `changeType` matches target_type=change_type /
        target_value=<changeType>; `alertSeverity` matches
        target_type=alert_severity / target_value=<alertSeverity>. With
        neither given, returns all runbooks.
      parameters:
        - name: changeType
          in: query
          required: false
          schema: { type: string }
          description: 'Filter to runbooks targeting this change type, e.g. vm.created. Mutually exclusive with alertSeverity.'
        - name: alertSeverity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
          description: Filter to runbooks targeting this alert severity. Mutually exclusive with changeType.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [runbooks]
      summary: Create a runbook (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /runbooks/{runbookId}:
    parameters: [{ $ref: '#/components/parameters/RunbookId' }]
    get:
      tags: [runbooks]
      summary: One runbook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [runbooks]
      summary: Update a runbook (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [runbooks]
      summary: Delete a runbook (operator)
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

