name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
      race_shards: ${{ steps.shards.outputs.race }}
      cover_shards: ${{ steps.shards.outputs.cover }}
      postgres_shards: ${{ steps.shards.outputs.postgres }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/ci/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci.yml'
            compose:
              - 'backend/**'
              - 'web/**'
              - 'docs/openapi.yaml'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'scripts/compose-smoke.sh'
              - 'scripts/compose-smoke.yml'
              - '.github/workflows/ci.yml'

      # Shard names come from scripts/ci/test-shards.json, the single place
      # shards are defined; see scripts/ci/test-shards.sh.
      - name: Load test shard matrices
        id: shards
        run: |
          for suite in race cover postgres; do
            echo "$suite=$(scripts/ci/test-shards.sh matrix "$suite")" >> "$GITHUB_OUTPUT"
          done

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # The shard check compiles test packages to list their tests.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: lint

      - name: Check gofmt
        run: |
          unformatted=$(find ./backend -name '*.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=3m

      - name: Validate test shard definitions
        run: scripts/ci/test-shards.sh check

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  staticcheck:
    name: Staticcheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: static

      # internal/web/dist/index.html is committed as an embed placeholder, so
      # vet/staticcheck work on a clean checkout without a built frontend.
      - name: Run go vet
        run: go vet ./...
        working-directory: backend

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  govulncheck:
    name: Govulncheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: vuln

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Regenerate API client and mocks
        run: bun run gen:api
        working-directory: web

      - name: Fail if generated client/mocks are stale
        run: |
          git add -A -- web/src/api/generated web/src/api/model
          if ! git diff --cached --quiet -- web/src/api/generated web/src/api/model; then
            echo "::error::web/src/api/generated or web/src/api/model is out of date with docs/openapi.yaml."
            echo "Run 'bun run gen:api' in web/ and commit the result."
            git diff --cached --stat -- web/src/api/generated web/src/api/model
            exit 1
          fi

      - name: Lint
        run: bun run lint
        working-directory: web

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Run tests with coverage
        run: bun run test:coverage
        working-directory: web

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: web/coverage
          retention-days: 7

  test-backend:
    name: Test (Backend, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.cover_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: cover

      - name: Run tests
        # -coverpkg=./... attributes coverage to the package under test, not just
        # the package the test file lives in: most handler packages here are
        # exercised through internal/api's router-level integration tests, so
        # per-package-only coverage (the previous default) undercounted them.
        # Shards write binary coverage data; the coverage job merges it.
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          scripts/ci/test-shards.sh run cover "$SHARD" -coverpkg=./... -- -test.gocoverdir="$RUNNER_TEMP/cov"
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: covdata-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov
          if-no-files-found: error
          retention-days: 1

      - name: Save Go cache
        if: matrix.shard == 'other'
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  coverage:
    name: Coverage (Backend)
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: cover

      - name: Download coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: covdata-*
          path: ${{ runner.temp }}/covdata

      - name: Merge coverage
        run: |
          mkdir -p "$RUNNER_TEMP/covmerged"
          go tool covdata merge -i="$(ls -d "$RUNNER_TEMP"/covdata/*/ | paste -sd, -)" -o "$RUNNER_TEMP/covmerged"
          go tool covdata textfmt -i="$RUNNER_TEMP/covmerged" -o coverage.out
        working-directory: backend

      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 60) ? 1 : 0 }'
        working-directory: backend

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 7

  test-backend-race:
    name: Test (Backend, race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.race_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The core and connector shards compile different packages, so they keep
      # separate build caches.
      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: ${{ matrix.shard == 'core' && 'race-core' || 'race-connectors' }}

      - name: Run race-sensitive tests
        run: scripts/ci/test-shards.sh run race "$SHARD" -race
        env:
          SHARD: ${{ matrix.shard }}

      - name: Save Go cache
        if: matrix.shard == 'core' || matrix.shard == 'connectors-rest'
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  test-backend-postgres:
    name: Test (Backend, Postgres, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.postgres_shards) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiselabz
          POSTGRES_PASSWORD: wiselabz
          POSTGRES_DB: wiselabz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiselabz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: postgres

      - name: Run store tests and migration parity against Postgres
        run: scripts/ci/test-shards.sh run postgres "$SHARD" -p 1
        env:
          SHARD: ${{ matrix.shard }}
          WISELABZ_TEST_POSTGRES_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      # Runs in one shard only; every shard has its own fresh Postgres service.
      - name: Verify migrate up/status/verify on Postgres
        if: matrix.shard == 'a-g'
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
        working-directory: backend
        env:
          WISELABZ_DB_DRIVER: postgres
          WISELABZ_DB_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      - name: Save Go cache
        if: matrix.shard == 'a-g'
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of lint/tests: CI Status aggregates every result.
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: build

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Copy frontend assets
        run: |
          mkdir -p backend/internal/web/dist
          cp -r web/dist/. backend/internal/web/dist/

      - name: Build backend binary
        run: go build -o /dev/null ./cmd/server
        working-directory: backend
        env:
          CGO_ENABLED: "0"

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Layer cache is written from main only and restored by PRs, like the Go
      # caches, to stay within the repository cache quota.
      - name: Build app image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          load: true
          tags: wiselabz:compose-smoke
          cache-from: type=gha,scope=compose-smoke
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=compose-smoke,mode=max' || '' }}

      - name: Migrate, boot, authenticate, and create a connector
        run: scripts/compose-smoke.sh
        env:
          COMPOSE_SMOKE_PREBUILT: "1"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-backend
      - staticcheck
      - govulncheck
      - lint-frontend
      - test-frontend
      - test-backend
      - coverage
      - test-backend-race
      - test-backend-postgres
      - build
      - compose-smoke
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check overall status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped by the path filter)."
