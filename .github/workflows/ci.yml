name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review: drafts defer the heavy jobs, so marking a PR ready
    # re-runs CI on the same commit with the full job selection.
    types: [opened, synchronize, reopened, ready_for_review]
  # The main ruleset merges through a merge queue, which needs CI Status on
  # the queued commit. Changes are classified from the queue's base to head.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Go is set up only when backend changed, to compute the Postgres closure.
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      compose: ${{ steps.classify.outputs.compose }}
      workflows: ${{ steps.classify.outputs.workflows }}
      gomod: ${{ steps.classify.outputs.gomod }}
      postgres: ${{ steps.closure.outputs.postgres || 'false' }}
      draft: ${{ github.event.pull_request.draft == true }}
      race_shards: ${{ steps.shards.outputs.race }}
      postgres_shards: ${{ steps.shards.outputs.postgres }}

    steps:
      # Depth 2: on pull_request HEAD is the merge commit and HEAD^1 the base,
      # which the web/package.json version-only rule compares against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Only lists the changed files; scripts/ci/changes.sh decides what they
      # mean (see "What CI runs" in docs/TESTING.md).
      - name: List changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Check classification rules
        run: scripts/ci/changes.sh check

      - name: Classify changes
        id: classify
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
          CI_EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          # An empty list would select nothing, so treat it as an error.
          if [[ -z $FILES ]]; then
            echo "::error::paths-filter returned no file list"
            exit 1
          fi
          jq -r '.[]' <<<"$FILES" |
            CHANGES_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/ci/changes.sh classify >> "$GITHUB_OUTPUT"
          if [[ $DRAFT == true ]]; then
            echo "**Draft: heavy jobs deferred** until the PR is marked ready for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Restore-only: nothing is saved from this job.
      - name: Setup Go
        if: steps.classify.outputs.backend == 'true' && github.event.pull_request.draft != true
        uses: ./.github/actions/go-cache-restore
        with:
          kind: lint

      - name: Postgres test closure
        id: closure
        if: steps.classify.outputs.backend == 'true' && github.event.pull_request.draft != true
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          scripts/ci/changes.sh check --go
          jq -r '.[]' <<<"$FILES" |
            CHANGES_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/ci/changes.sh go-closure >> "$GITHUB_OUTPUT"

      # Shard names come from scripts/ci/test-shards.json, the single place
      # shards are defined; see scripts/ci/test-shards.sh.
      - name: Load test shard matrices
        id: shards
        run: |
          for suite in race postgres; do
            echo "$suite=$(scripts/ci/test-shards.sh matrix "$suite")" >> "$GITHUB_OUTPUT"
          done

  actionlint:
    name: Lint (Workflows)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships shellcheck, which actionlint runs on run: blocks.
      - name: Download actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ${{ steps.actionlint.outputs.executable }} -color

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    # The shard check compiles test packages to list their tests.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: lint

      - name: Check gofmt
        run: |
          unformatted=$(find ./backend -name '*.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=3m

      - name: Validate test shard definitions
        run: scripts/ci/test-shards.sh check

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  staticcheck:
    name: Staticcheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: static

      # internal/web/dist/index.html is committed as an embed placeholder, so
      # vet/staticcheck work on a clean checkout without a built frontend.
      - name: Run go vet
        run: go vet ./...
        working-directory: backend

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  govulncheck:
    name: Govulncheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    # Only when Go modules change; govulncheck-nightly.yml covers new advisories
    # against unchanged dependencies.
    if: needs.changes.outputs.gomod == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: vuln

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Regenerate API client and mocks
        run: bun run gen:api
        working-directory: web

      - name: Fail if generated client/mocks are stale
        run: |
          git add -A -- web/src/api/generated web/src/api/model
          if ! git diff --cached --quiet -- web/src/api/generated web/src/api/model; then
            echo "::error::web/src/api/generated or web/src/api/model is out of date with docs/openapi.yaml."
            echo "Run 'bun run gen:api' in web/ and commit the result."
            git diff --cached --stat -- web/src/api/generated web/src/api/model
            exit 1
          fi

      - name: Lint
        run: bun run lint
        working-directory: web

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Run tests with coverage
        run: bun run test:coverage
        working-directory: web

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: web/coverage
          retention-days: 7

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: cover

      - name: Run tests
        # -coverpkg attributes coverage to the package under test, not just
        # the package the test file lives in: most handler packages here are
        # exercised through internal/api's router-level integration tests, so
        # per-package-only coverage (the previous default) undercounted them.
        # coverpkg.sh lists ./... minus test-only helper packages. One job,
        # not shards: after #401 the whole run takes about as long as the
        # slowest former shard and matches its merged coverage (see
        # docs/TESTING.md).
        run: go test -coverpkg="$(../scripts/ci/coverpkg.sh)" -coverprofile=coverage.out ./...
        working-directory: backend

      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 60) ? 1 : 0 }'
        working-directory: backend

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 7

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  test-backend-race:
    name: Test (Backend, race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.race_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One shard since #401 (see docs/TESTING.md); the matrix stays so the
      # suite can be re-split in scripts/ci/test-shards.json alone.
      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: race

      - name: Run race-sensitive tests
        run: scripts/ci/test-shards.sh run race "$SHARD" -race
        env:
          SHARD: ${{ matrix.shard }}

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  test-backend-postgres:
    name: Test (Backend, Postgres, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    # Only when the change touches the Go dependency closure of the Postgres
    # test packages (scripts/ci/changes.sh go-closure).
    if: needs.changes.outputs.postgres == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.postgres_shards) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiselabz
          POSTGRES_PASSWORD: wiselabz
          POSTGRES_DB: wiselabz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiselabz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: postgres

      - name: Run store tests and migration parity against Postgres
        run: scripts/ci/test-shards.sh run postgres "$SHARD" -p 1
        env:
          SHARD: ${{ matrix.shard }}
          WISELABZ_TEST_POSTGRES_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      # Runs in one shard only; every shard has its own fresh Postgres service.
      - name: Verify migrate up/status/verify on Postgres
        if: matrix.shard == 'a-g'
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
        working-directory: backend
        env:
          WISELABZ_DB_DRIVER: postgres
          WISELABZ_DB_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      - name: Save Go cache
        if: matrix.shard == 'a-g'
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of lint/tests: CI Status aggregates every result.
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.changes.outputs.draft != 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: build

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Copy frontend assets
        run: |
          mkdir -p backend/internal/web/dist
          cp -r web/dist/. backend/internal/web/dist/

      - name: Build backend binary
        run: go build -o /dev/null ./cmd/server
        working-directory: backend
        env:
          CGO_ENABLED: "0"

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer cache is written from main only and restored by PRs, like the Go
      # caches, to stay within the repository cache quota.
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wiselabz:compose-smoke
          cache-from: type=gha,scope=compose-smoke
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=compose-smoke,mode=max' || '' }}

      - name: Migrate, boot, authenticate, and create a connector
        run: scripts/compose-smoke.sh
        env:
          COMPOSE_SMOKE_PREBUILT: "1"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - actionlint
      - lint-backend
      - staticcheck
      - govulncheck
      - lint-frontend
      - test-frontend
      - test-backend
      - test-backend-race
      - test-backend-postgres
      - build
      - compose-smoke
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check overall status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped by the path filter)."
