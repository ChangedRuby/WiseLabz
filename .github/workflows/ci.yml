name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - 'docs/openapi.yaml'
              - '.github/workflows/ci.yml'
            compose:
              - 'backend/**'
              - 'web/**'
              - 'docs/openapi.yaml'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'scripts/compose-smoke.sh'
              - 'scripts/compose-smoke.yml'
              - '.github/workflows/ci.yml'

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          unformatted=$(find ./backend -name '*.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=3m

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Regenerate API client and mocks
        run: bun run gen:api
        working-directory: web

      - name: Fail if generated client/mocks are stale
        run: |
          git add -A -- web/src/api/generated web/src/api/model
          if ! git diff --cached --quiet -- web/src/api/generated web/src/api/model; then
            echo "::error::web/src/api/generated or web/src/api/model is out of date with docs/openapi.yaml."
            echo "Run 'bun run gen:api' in web/ and commit the result."
            git diff --cached --stat -- web/src/api/generated web/src/api/model
            exit 1
          fi

      - name: Lint
        run: bun run lint
        working-directory: web

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Run tests with coverage
        run: bun run test:coverage
        working-directory: web

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: web/coverage
          retention-days: 7

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        # -coverpkg=./... attributes coverage to the package under test, not just
        # the package the test file lives in: most handler packages here are
        # exercised through internal/api's router-level integration tests, so
        # per-package-only coverage (the previous default) undercounted them.
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...
        working-directory: backend

      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 60) ? 1 : 0 }'
        working-directory: backend

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 7

  test-backend-race:
    name: Test (Backend, race)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run race-sensitive tests
        run: go test -race ./internal/ws/... ./internal/notifications/... ./internal/sync/... ./internal/api/connectors/...
        working-directory: backend

  test-backend-postgres:
    name: Test (Backend, Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiselabz
          POSTGRES_PASSWORD: wiselabz
          POSTGRES_DB: wiselabz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiselabz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run store tests and migration parity against Postgres
        run: go test -p 1 ./internal/store/...
        working-directory: backend
        env:
          WISELABZ_TEST_POSTGRES_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      - name: Verify migrate up/status/verify on Postgres
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
        working-directory: backend
        env:
          WISELABZ_DB_DRIVER: postgres
          WISELABZ_DB_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint-backend, lint-frontend, test-frontend, test-backend, test-backend-race, test-backend-postgres]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Copy frontend assets
        run: |
          mkdir -p backend/internal/web/dist
          cp -r web/dist/. backend/internal/web/dist/

      - name: Build backend binary
        run: go build -o /dev/null ./cmd/server
        working-directory: backend
        env:
          CGO_ENABLED: "0"

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Migrate, boot, authenticate, and create a connector
        run: scripts/compose-smoke.sh

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, lint-backend, lint-frontend, test-frontend, test-backend, test-backend-race, test-backend-postgres, build, compose-smoke]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check overall status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped by the path filter)."
