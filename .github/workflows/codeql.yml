name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/**"
      # Last: a later negation excludes paths matched above.
      - "!backend/**/*.md"
  pull_request:
    branches: [main]
    # Drafts skip the scan; marking a PR ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/**"
      # Last: a later negation excludes paths matched above.
      - "!backend/**/*.md"
  schedule:
    - cron: "0 8 * * 1"

# A newer push to the same PR cancels the running scan. Main and scheduled
# runs get a group of their own (run id): a shared group would drop queued
# runs, and every main commit must keep its SARIF upload.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Go)
    if: github.event.pull_request.draft != true
    # Scheduled scans can run on the self-hosted runner named by the
    # CODEQL_RUNNER repository variable (unset = GitHub-hosted). PR and push
    # scans always stay GitHub-hosted: fork PR code must never reach a
    # self-hosted runner, and main's caches must stay restorable by PRs.
    runs-on: ${{ (github.event_name == 'schedule' && vars.CODEQL_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15

    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          languages: go
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: go build ./...
        working-directory: backend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
